<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number counting </title>
    <style>
        body{
            text-align: center;
            font-family: arial;
            margin: 50px;
        }

        button{
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
        }
    </style>
</head>
<body>
    
    <h2>Number Counting </h2>

    <button onclick="countNumber()">Start Counting </button>

    <h3 id="result"></h3>

    <script>

        function countNumber(){
            let output="";

            for(let i=1;i<=10;i++){
                console.log("*")
                output+=i+"<br>";
            }
            document.getElementById("result").innerHTML= output;
        }
    </script>
    
</body>
</html>
