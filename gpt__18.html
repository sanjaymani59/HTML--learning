<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage </title>
</head>
<style>
    body{
        text-align: center;
        margin-top: 100px;
        font-family: arial;

    }
    h1{
        font-size: 60px;
    }

    button{
        padding:10px 20px;
        cursor: pointer;
        border-radius: 50px;
        background-color: orange;
        box-shadow: none;
        border: none;
    }

    .continer{
        padding: 100px;
        width: 100px;
        text-align: center;
        background-color: lightgreen;
        margin-left: 400px;    }

    button:hover{
        background-color: lightcoral;
        color: white;
    }
</style>
<body>
    <div class="continer">
        <h2>Dice Roller</h2>

    <h1 id="dice">(oo)</h1>

    <button onclick="rolldice()">Roll Dice</button>
    </div>
    

    <script>
        function rolldice(){

            let number =Math.floor(Math.random()*6)+1;


            document.getElementById("dice").innerHTML=number;
        }
        
    </script>

</body>
</html>
