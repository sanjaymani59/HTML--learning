<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile card</title>
    <style>
        body{
            background-color: lightblue;
            font-family: arial;
            text-align: center;
            margin-top: 100px;    
        }

        .card{
            background-color: white;
            width: 300px;
            
            margin: auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray ;
        }

        h1{
            color: blue;
        }

        h2{
            color: green;
        }

        p{
            color:gray;
            font-size:16px;
        }

        button{
            background-color: blue;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>My Profilecard</h1>

    <p> I am Beginner learning web development . </p>

    <p>My Favourite subject is computer science . </p>
    
    <button>Contact Me </button>
    </div>
    
</body>
</html>
