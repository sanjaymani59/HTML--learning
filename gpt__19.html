<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            text-align: center;
            margin-top:100px;
            font-family: arial;
        }
        h1{
            font-size: 80px;
        }
        button{
            padding: 10px 20px ;
        }
    </style>
</head>
<body>
    <h2>Bulb On </h2>
    <h1 id="bulb">(00)</h1>
    <button onclick="turnon()">ON</button>
    <button onclick="turnoff()">OFF</button>

    <script>
        function turnon(){
            document.getElementById("bulb").innerHTML="ONNNN";
        }

        function turnoff(){
            document.getElementById("bulb").innerHTML="OFFFF"        }
    </script>



</body>
