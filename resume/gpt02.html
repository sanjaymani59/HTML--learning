<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gpt 02</title>
    <style>
        body{
            background-attachment: lightgray ;
            font-family: arial;
            text-align: center;
            padding-top: 50px;
        
        }
        .card{
            background-color: white;
            width: 300px;
            margin: auto;
            padding: 25px;
            border: 2px solid gray;
            border-radius: 15px;
            
        }
        .card img{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            
        }
        .card h1{
            color: blue;
        }

        .card p{
            color: gray;
            font-size: 18px;

        }

        button{
            background-color: blue;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background-color: darkblue;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="tiger.jpg" alt="tiger">
        <h1>SAM</h1>
        <p>Compter Science Student</p>
        <h2>My Skills</h2>
        <p>HTML| CSS | JAVASCRIPT</p>
        <button>Contect Me </button>
    </div>
    
</body>
</html>
