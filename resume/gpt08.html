<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gpt 08</title>
    <style>
        body{
            font-family: arial;
            text-align: center;
            background-color: #f5f5f5;
        }

        header{
            background-color: orange;
            padding: 20px;
        }

        .food-container{
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .food{
            background-color: white;
            width: 200px;
            padding: 20px;
            border-radius: 10px;
        }

        button{
            background-color: orange;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkorange;
        }
    </style>



</head>
<body>
    <header>
        <h1>My Food Shop</h1>
        <p>Delicious food at your place </p>
    </header>

    <div class="food-container">
        <div class="food">
            <h2>pizza </h2>
            <p>150</p>
            <button onclick="order('pizza  ')">order</button>
        </div>

        <div class="food">
            <h2>Burger </h2>
            <p>200</p>
            <button onclick="order('Burger  ')">order</button>
        </div>


        <div class="food">
            <h2>french fries </h2>
            <p>110</p>
            <button onclick="order('french fries ')">order</button>
        </div>
    </div>

    <h2 id="message"></h2>

    
</body>
</html>

<script>
    function order(foodName){
        document.getElementById("message").innerHTML=foodName+"ordered successfully !!!!!!!"
    }
</script>
