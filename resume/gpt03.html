<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gpt-3</title>

    <style>
        body{
            background-color: lightgray;
            font-family: arial;
        }
        .login{
            background-color: white;
            width: 300px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
        }
        h1{
            text-align: center;
            color: blue;
        }
        label{
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input{
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 5px;
        }
        button{
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
            background-color: darkblue;
        }

        a{
            color: blue;
            text-decoration: none;
        }

        a:hover{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login">
        <h1>Login</h1>
        <label>Username</label>
        <input type="text" placeholder="Enter Username">

        <label>Password</label>
        <input type="password" placeholder="Enter Password">

        <button>Login</button>

        <p>Don't have an account </p>
        <a href="#">Register</a>
    </div>
    
</body>
</html>
