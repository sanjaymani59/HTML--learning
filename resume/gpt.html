<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple gpt </title>

    <style>
        body{
            background-color: lightgray;
            font-family: arial;
            margin: 0;
        }

        header{
            background-color: blue;
            color: white;
            text-align: center;
            padding: 30px;
        }

        nav{
            background-color: white;
            padding: 29px;
            text-align: center;
        }
        nav a{
            color: black;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover{
            color: blue;
        }
        main{
            padding: 20px;
        }

        section{
            background-color: rgb(250, 243, 243);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            transition: 1s;
        }
        section:hover{
            background-color: rgb(102, 255, 0);
        }

        select h3{
            color: blue;
        }

        footer{
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
        }

    </style>
</head>
<body>
    <header>
        <h1> gpt </h1>
        <p>Welcome gpt </p>
    </header>
    <nav>
        <a href="#">home </a>
        <a href="#">about</a>
        <a href="#">Contact</a>
    </nav>

    <main> 
        <section>
            <h2>About me </h2>
            <p>hello to html and css</p>
        </section>

        <section>
            <h3>skills</h3>
            <p>html </p>
            <p>css</p>
        </section>
    </main>

    <footer>
        <p>Copyrigth @2026</p>
    </footer>
</body>
</html>
