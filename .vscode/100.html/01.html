<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Quiz Game
    </title>
    <link rel="stylesheet" href="01.css">
</head>
<body>
    <div class="continer">
        <div class="screen" id="start-screen ">
            <h1> Quiz Time!</h1>
            <p>Test your knowledege with these fun questios</p>
     
        <button id="start-btn">Start Quiz</button>
    </div>
    <div class="screen active" id="quiz screen">
        <div class="Quiz-header">
            <h2 id="question-text"> Questions goes here</h2>
            <div div="quis-info"></div>
            <p>Question <span id="current-question">1</span>of <span>5</span></p>

            <p>Score:<span id="Score">0</span></p>

        </div>
    </div>

    <div id="answer-continer" class="answer-continer">
        <!-- answer will be coming here -->

    </div>
    <div class="progres-bar">
        <div id="progress" class="progress"> </div>

    </div>

   
    <div id="result-screen" class="screen ">
        <h1>Quiz Result </h1>
        <div class="result-info">
            <p>you scored <span id="final-score">0</span> out of<span id="max-score"></span></p>
            <div id="result-message">Good job</div>
        </div>
        <button id="restart-btn" >Restart Quic</button>

    </div>
    
    
</body>
</html>
