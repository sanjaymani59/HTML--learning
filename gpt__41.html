    <script>
        function calc(){
            let n=Number(num.value),f=1;
            for(let i=1;i<=n;i++) f*=i;
                 result.innerHTML="Factorial = "+f;


          function calc1(){

            result.innerHTML="Factorial = "+f;
        }
