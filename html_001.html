<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html__001</title>
    <style>
        body{
            text-align: center;
            font-family: arial ;
            background-color: lightyellow;
            margin-top: 80px;
        }

        textarea{
            width: 300px;
            height: 120px;
            padding:10px;
            font-size: 16px;
        }

        h2{
            color:16px;
        }
    </style>
</head>
<body>

    <h1>character counter </h1>
    <p>type something beloe:</p>

    <textarea id="message" placeholder="type here.........." ></textarea>

    <h2> character :<span id="count">0</span></h2>

    <script>
        let message =document.getElementById("message");

        message.addEventListener("input", function(){
            let count =message.value.length;

            document.getElementById("count").innerHTML=count;
        })
    </script>
    
</body>
</html>
