<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>multiplication table</h2>
    <input id="num" placeholder="Enter number ">
    <button onclick="show()">Generate</button>
    <p id="result"></p>

    <script>
        function show(){
            let n=Number(num.value),s="";
            for(let i=1;i<=10;i++) s+=n+"x"+i+"="+n*i+"<br>";
            result.innerHTML=s;
        }
    </script>
</body>
</html>
